<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="pelicanTitle pelicanDesc">
  <title id="pelicanTitle">A pelican riding a bicycle</title>
  <desc id="pelicanDesc">A cheerful cream-colored pelican with a large orange beak pedals a blue bicycle along a grassy path under a sunny sky.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e4ff"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed081"/>
      <stop offset="1" stop-color="#5fae5c"/>
    </linearGradient>
    <radialGradient id="bodyFill" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#f7f3e8"/>
      <stop offset="1" stop-color="#e2dac6"/>
    </radialGradient>

    <g id="wheel">
      <circle r="78" fill="none" stroke="#2b2b2b" stroke-width="10"/>
      <circle r="68" fill="none" stroke="#c9d3da" stroke-width="3"/>
      <g stroke="#b9c6cf" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="-66" x2="0" y2="66"/>
        <line x1="-66" y1="0" x2="66" y2="0"/>
        <line x1="-47" y1="-47" x2="47" y2="47"/>
        <line x1="-47" y1="47" x2="47" y2="-47"/>
      </g>
      <circle r="9" fill="#8b98a3"/>
      <circle r="4" fill="#5a6670"/>
    </g>
  </defs>

  <!-- sky and sun -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="694" cy="88" r="46" fill="#ffe07a"/>
  <circle cx="694" cy="88" r="30" fill="#ffeb9e"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="150" cy="120" rx="58" ry="30"/>
    <ellipse cx="196" cy="104" rx="42" ry="26"/>
    <ellipse cx="110" cy="108" rx="36" ry="22"/>
    <ellipse cx="615" cy="180" rx="48" ry="24"/>
    <ellipse cx="655" cy="168" rx="34" ry="20"/>
    <ellipse cx="580" cy="170" rx="30" ry="18"/>
  </g>

  <!-- ground -->
  <rect x="0" y="520" width="800" height="80" fill="url(#grass)"/>
  <ellipse cx="420" cy="528" rx="240" ry="17" fill="#000000" opacity="0.10"/>

  <!-- speed lines -->
  <g stroke="#a9d8f2" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M120 300 H 210" fill="none"/>
    <path d="M96 356 H 168" fill="none"/>
    <path d="M132 412 H 196" fill="none"/>
  </g>

  <!-- far leg and pedal -->
  <path d="M330 315 C 338 352 350 386 378 430" fill="none" stroke="#d98a1f" stroke-width="11" stroke-linecap="round"/>
  <rect x="368" y="433" width="34" height="10" rx="4" fill="#333"/>

  <!-- wheels -->
  <use href="#wheel" x="300" y="442"/>
  <use href="#wheel" x="540" y="442"/>

  <!-- frame -->
  <g stroke="#2c6f9e" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M300 442 L 415 458"/>
    <path d="M415 458 L 360 332"/>
    <path d="M360 332 L 518 340"/>
    <path d="M415 458 L 518 340"/>
    <path d="M360 332 L 300 442"/>
    <path d="M518 340 L 532 408"/>
    <path d="M532 408 L 540 442"/>
  </g>

  <!-- handlebar -->
  <g stroke="#2c6f9e" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M518 340 L 524 312"/>
    <path d="M500 308 Q 524 296 548 308"/>
  </g>
  <g stroke="#1f2a30" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M500 308 L 494 312"/>
    <path d="M548 308 L 554 312"/>
  </g>

  <!-- crank and pedals -->
  <g stroke="#5a6670" stroke-width="7" stroke-linecap="round">
    <path d="M415 458 L 445 478"/>
    <path d="M415 458 L 385 438"/>
  </g>
  <circle cx="415" cy="458" r="13" fill="#8b98a3"/>
  <circle cx="415" cy="458" r="5" fill="#5a6670"/>
  <rect x="428" y="474" width="36" height="10" rx="4" fill="#333"/>

  <!-- seat -->
  <rect x="326" y="318" width="66" height="16" rx="8" fill="#333" transform="rotate(-4 359 326)"/>

  <!-- pelican body -->
  <g transform="rotate(-8 345 262)">
    <path d="M292 250 C 258 244 222 252 200 272 C 232 276 262 286 286 300 Z" fill="#e7e0cd" stroke="#d2c9b3" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="345" cy="262" rx="80" ry="60" fill="url(#bodyFill)" stroke="#d2c9b3" stroke-width="3"/>
    <path d="M300 244 C 352 226 408 250 404 286 C 401 314 344 322 310 300 C 288 286 286 258 300 244 Z" fill="#f1ebdb" stroke="#d2c9b3" stroke-width="3"/>
    <path d="M318 268 C 344 280 380 280 398 266" fill="none" stroke="#d8cfb8" stroke-width="3" stroke-linecap="round"/>
    <path d="M322 288 C 346 296 374 294 392 284" fill="none" stroke="#d8cfb8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- neck -->
  <path d="M370 240 C 392 202 414 176 440 166" fill="none" stroke="#d2c9b3" stroke-width="46" stroke-linecap="round"/>
  <path d="M370 240 C 392 202 414 176 440 166" fill="none" stroke="#f7f3e8" stroke-width="38" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="448" cy="160" r="34" fill="#f7f3e8" stroke="#d2c9b3" stroke-width="3"/>

  <!-- little crest -->
  <path d="M430 128 C 424 116 430 110 436 116 C 440 108 448 112 446 122" fill="#f1ebdb" stroke="#d2c9b3" stroke-width="3" stroke-linejoin="round"/>

  <!-- beak -->
  <path d="M468 138 Q 550 144 632 172 Q 552 186 468 170 Z" fill="#f2a63b" stroke="#d98a1f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M470 168 Q 512 224 600 182 Q 540 202 470 170 Z" fill="#f7c15c" stroke="#d98a1f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M468 152 Q 540 158 630 172" fill="none" stroke="#d98a1f" stroke-width="2.5"/>
  <path d="M630 172 C 640 174 644 180 638 184" fill="none" stroke="#d98a1f" stroke-width="5" stroke-linecap="round"/>

  <!-- eye -->
  <circle cx="456" cy="150" r="7" fill="#ffffff" stroke="#d2c9b3" stroke-width="1.5"/>
  <circle cx="458" cy="150" r="3.6" fill="#2b2b2b"/>
  <circle cx="459.4" cy="148.6" r="1.2" fill="#ffffff"/>

  <!-- near leg and foot -->
  <path d="M356 316 L 392 402 L 440 470" fill="none" stroke="#f0a02a" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="392" cy="402" r="8" fill="#f0a02a" stroke="#d98a1f" stroke-width="2.5"/>
  <path d="M424 464 L 452 464 L 462 478 L 434 486 L 421 474 Z" fill="#f0a02a" stroke="#d98a1f" stroke-width="3" stroke-linejoin="round"/>
</svg>
